<form [formGroup]="departmentForm" class="form-container" style="font-size: 0.85rem;">

    <ng-container *ngFor="let field of departmentFieldData">
        <ng-container [ngSwitch]="field.controlType">

            <mat-form-field *ngSwitchCase="'text'" class="mb-lg-2 w-100" appearance="outline">
                <mat-label class="text-capitalize">{{field.controlLabel}}</mat-label>
                <input matInput [formControlName]="field.controlName">
                <mat-error *ngIf="departmentForm.get(field.controlName)?.hasError('required')">{{field.controlLabel}} is required</mat-error>
            </mat-form-field>

            <mat-form-field *ngSwitchCase="'select'" class="mb-lg-2 w-100" appearance="outline">
                <mat-label>{{field.controlLabel}}</mat-label>
                <mat-select
                    class="selectField"
                    disableOptionCentering
                    panelClass="matDropdown"
                    [formControlName]="field.controlName"
                >
                    <mat-option *ngFor="let option of field.selectOptions | keyvalue" [value]="option.key">{{option.value}}</mat-option>
                </mat-select>
                <mat-error *ngIf="departmentForm.get(field.controlName)?.hasError('required')">{{field.controlLabel}} is required</mat-error>
            </mat-form-field>

            <mat-form-field *ngSwitchCase="'textarea'" class="mb-lg-1 w-100" appearance="outline">
                <mat-label>{{field.controlLabel}}</mat-label>
                <textarea rows="2" matInput [formControlName]="field.controlName"></textarea>
            </mat-form-field>

        </ng-container>
    </ng-container>

    <div class="d-flex justify-content-end mt-3">
        <div (click)="onSubmit()" class="cta primary-bkg mmd text-uppercase" style="min-width: 30%">
            Submit <span *ngIf="apiLoading" class="loader ms-1"></span>
        </div>
    </div>

</form>
