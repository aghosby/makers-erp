<div class="content-wrap">

    <div class="row-section d-flex justify-content-between align-items-center">
        <div class="page-header">Vendors</div>
        <div class="main-actions d-flex justify-content-start align-items-center">
            <div (click)="addNewVendor()" class="cta primary-bkg icon md">
                <span class="icon">
                    <app-icon [iconName]="'userPlus'" [iconWidth]="24" [iconHeight]="24"></app-icon>
                </span>
                Add Vendor
            </div>
            <div (click)="addBulkVendors()" class="cta trans-bkg icon md ms-lg-3">
                <span class="icon">
                    <app-icon [iconName]="'download'" [iconWidth]="24" [iconHeight]="24"></app-icon>
                </span>
                Import
            </div>
            <div class="cta trans-bkg icon md ms-lg-3">
                <span class="icon">
                    <app-icon [iconName]="'export'" [iconWidth]="24" [iconHeight]="24"></app-icon>
                </span>
                Export
            </div>
        </div>
    </div>

    <div class="row-section my-lg-4">
        <div class="table-wrap">
            <div class="inner-row d-flex justify-content-start align-items-center">
                <div class="search-bar">
                    <span class="icon"><i class="bi bi-search"></i></span>
                    <input type="text" placeholder="Search for a vendor">
                </div>

                <div class="filter-options">
                    <div class="filter-trigger"><i class="bi bi-filter"></i> Filter</div>
                </div>

                <div class="bulk-actions d-flex justify-content-between align-items-center">
                    <!-- <div [matMenuTriggerFor]="bulkOptions" class="dropdown-trigger"> Bulk Actions <i class="bi bi-chevron-down"></i></div>
                    <mat-menu #bulkOptions="matMenu" class="more">
                        <div (click)="assignManager('Manager', 'bulk')" class="menu-item" mat-menu-item>Assign Manager</div>
                        <div (click)="assignManager('Approver', 'bulk')" class="menu-item" mat-menu-item>Assign Approvers</div>
                    </mat-menu> -->
                    <div class="cta primary-bkg sm ms-lg-2">Apply</div>
                </div>
            </div>

            <div class="inner-row">
                <table 
                    mat-table
                    [dataSource]="dataSource"
                    class="dataTable lg mat-elevation-z0"
                    matSort
                >
                    <!-- Table Columns -->
                    <ng-container *ngFor="let column of tableColumns; let row" [matColumnDef]="column.label">
                        <ng-container *ngIf="column.key == 'select'">
                            <th style="width:5%" mat-header-cell *matHeaderCellDef>
                                <mat-checkbox 
                                    color="primary"
                                    (change)="$event ? masterToggle() : null"
                                    [checked]="selection.hasValue() && isAllSelected()"
                                    [indeterminate]="selection.hasValue() && !isAllSelected()">
                                </mat-checkbox>
                            </th>
                    
                            <td mat-cell *matCellDef="let row">
                                <mat-checkbox
                                    color="primary" 
                                    (click)="$event.stopPropagation()"
                                    (change)="$event ? selection.toggle(row) : null"
                                    [checked]="selection.isSelected(row)">
                                </mat-checkbox>
                            </td>
                        </ng-container>

                        <ng-container *ngIf="column.key == 'logo'">
                            <th style="width:5%" mat-header-cell *matHeaderCellDef></th>
                            <td style="width:1%; white-space: nowrap;" mat-cell *matCellDef="let row">
                                <img class="table-img w-auto bd-rd-0" src="{{row.imageUrl}}" alt="">
                                <!-- <span class="table-img bkg-standard" style="background-image: url('{{row.imageUrl}}');"></span> -->
                            </td>
                        </ng-container>

                        <ng-container *ngIf="column.key == 'address'">
                            <th [style.width]="column.columnWidth" mat-header-cell *matHeaderCellDef>{{ column.label }}</th>
                            <td style="white-space: nowrap;" mat-cell *matCellDef="let row">
                                <div class="major text-capitalize">{{row.address.city}}, {{row.address?.state}}</div>
                                <!-- <div class="minor mt-1 text-capitalize">{{ row.industry.industryName }}</div> -->
                            </td>
                        </ng-container>

                        <ng-container *ngIf="column.key == 'actions'">
                            <th [style.width]="column.columnWidth" mat-header-cell *matHeaderCellDef>
                            </th>
                            <td style="width:1%; white-space: nowrap;" mat-cell *matCellDef="let row">
                                <span (click)="viewVendor(row)" class="table-icon edit"><i class="bi bi-eye-fill"></i></span>
                                <span (click)="deleteVendor(row)" class="table-icon delete ms-lg-3"><i class="bi bi-trash3-fill"></i></span>
                                <span [matMenuTriggerFor]="moreOptions" class="table-icon more ms-lg-2"><i class="bi bi-three-dots-vertical"></i></span>
                                <mat-menu #moreOptions="matMenu" class="more">
                                    <!-- <div class="menu-item" mat-menu-item>Assign Manager</div>
                                    <div class="menu-item" mat-menu-item>Assign Approvers</div> -->
                                </mat-menu>
                            </td>
                        </ng-container>

                        <ng-container>
                            <th [style.width]="column.columnWidth" mat-header-cell *matHeaderCellDef>{{ column.key == 'image' || column.key == 'actions' ? "" : column.label }}</th>
                            <td mat-cell *matCellDef="let row">{{ row[column.key] }}</td>
                        </ng-container>
                        
                    </ng-container>


                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let emprow; columns: displayedColumns">
                    </tr>

                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                            <div class="empty-data">
                                <img src="../../../../assets/images/illustrations/empty1.png" alt=""/>
                                <div class="text">No vendor records were found.</div>
                            </div>
                        </td>
                    </tr>


                    
                </table>
            </div>
        </div>
        
    </div>
</div>
