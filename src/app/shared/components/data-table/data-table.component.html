<div class="table-wrap">

    <!-- Toolbar: search + filter toggle + projected extras (bulk actions etc.) -->
    <div class="inner-row d-flex justify-content-start align-items-center">

        <div *ngIf="showSearch" class="search-bar">
            <span class="icon"><i class="bi bi-search"></i></span>
            <input
                (input)="onSearch($event.target['value'])"
                type="text"
                [placeholder]="searchPlaceholder"
            >
        </div>

        <div
            *ngIf="filters?.length"
            (click)="showFilters = !showFilters"
            class="cta trans-bkg icon md ms-lg-3"
        >
            <span class="icon pe-1">
                <app-icon [iconName]="'funnel'" [iconWidth]="24" [iconHeight]="24"></app-icon>
            </span>
            Filter
        </div>

        <!-- Slot for bulk actions and other toolbar additions from the parent -->
        <ng-content select="[tableToolbar]"></ng-content>

    </div>

    <!-- Filter panel -->
    <div *ngIf="showFilters && filters?.length" class="inner-row d-flex justify-content-start align-items-center filter-wrap">
        <app-table-filter
            [filters]="filters"
            [initialState]="{}"
            (filtersChange)="onFiltersChange($event)"
            [fWidth]="160"
        ></app-table-filter>
    </div>

    <!-- Table + paginator -->
    <div class="inner-row">
        <table
            mat-table
            [dataSource]="dataSource"
            class="dataTable lg mat-elevation-z0"
            matSort
        >

            <!-- Checkbox selection column (rendered when showSelection is true) -->
            <ng-container *ngIf="showSelection" matColumnDef="__select__">
                <th style="width: 5%" mat-header-cell *matHeaderCellDef>
                    <mat-checkbox
                        color="warn"
                        (change)="$event ? masterToggle() : null"
                        [checked]="isAllSelected()"
                        [indeterminate]="isIndeterminate()">
                    </mat-checkbox>
                </th>
                <td mat-cell *matCellDef="let row">
                    <mat-checkbox
                        color="warn"
                        (click)="$event.stopPropagation()"
                        (change)="$event ? toggleRow(row) : null"
                        [checked]="selection.isSelected(row)">
                    </mat-checkbox>
                </td>
            </ng-container>

            <!-- Dynamic columns — each resolved to a custom template or the default text renderer -->
            <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
                <th
                    mat-header-cell
                    *matHeaderCellDef
                    [style.width]="col.columnWidth"
                    [mat-sort-header]="col.key"
                    [disabled]="!col.sortable"
                >
                    {{ col.hideLabel ? '' : col.label }}
                </th>
                <td mat-cell *matCellDef="let row" style="white-space: nowrap">
                    <ng-container *ngIf="getTemplate(col.key) as tmpl; else defaultCell">
                        <ng-container *ngTemplateOutlet="tmpl; context: { $implicit: row, column: col }"></ng-container>
                    </ng-container>
                    <ng-template #defaultCell>{{ row[col.key] }}</ng-template>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

            <!-- Loading and empty states shown only when data source is empty -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                    <app-loading-data *ngIf="isLoading" [height]="emptyHeight"></app-loading-data>
                    <app-no-data
                        *ngIf="!isLoading && (!data || data.length === 0)"
                        [height]="emptyHeight"
                        [icon]="emptyIcon"
                        [message]="emptyMessage">
                    </app-no-data>
                </td>
            </tr>

        </table>

        <mat-paginator
            [length]="totalItems"
            [pageSize]="pageSize"
            [pageSizeOptions]="pageSizeOptions"
            (page)="onPaginatorPage($event)">
        </mat-paginator>
    </div>

</div>
